name: Check DBeaver p2 dependency pins

# pom.xml pins org.jkiss.dbeaver.model/ui and org.jkiss.utils to an exact build qualifier
# fetched from https://dbeaver.io/update/latest/plugins/, which only ever serves the latest
# DBeaver build -- these pins will eventually 404 or drift behind what's published. This
# workflow runs on a schedule and, on drift, bumps the pins, verifies the build and opens a
# pull request. If the bumped build fails (a DBeaver API change needs a human), it falls back
# to a tracking issue instead of that only being discovered when a real build (e.g. release.yml)
# happens to run after the site has moved on.
#
# Requires Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests". PRs opened with GITHUB_TOKEN do not trigger other workflows, which is why the
# build is run here rather than relying on pull_request checks.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  BOT_BRANCH: bot/dbeaver-p2-pins

jobs:
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compare pinned versions against the live p2 site
        id: check
        run: |
          set -euo pipefail

          BASE_URL=$(grep -oP '(?<=<dbeaver.p2.baseUrl>)[^<]+' pom.xml)
          MODEL_PINNED=$(grep -oP '(?<=<dbeaver.model.version>)[^<]+' pom.xml)
          UI_PINNED=$(grep -oP '(?<=<dbeaver.ui.version>)[^<]+' pom.xml)
          UTILS_PINNED=$(grep -oP '(?<=<dbeaver.jkissutils.version>)[^<]+' pom.xml)

          echo "Pinned: model=$MODEL_PINNED ui=$UI_PINNED utils=$UTILS_PINNED"
          echo "Listing: $BASE_URL/"

          LISTING=$(curl -sf "$BASE_URL/")

          latest_version() {
            # $1: jar name prefix, e.g. org.jkiss.dbeaver.model_
            echo "$LISTING" \
              | grep -oE "${1}[0-9][0-9A-Za-z._-]*\.jar" \
              | sed -E "s/${1}(.*)\.jar/\1/" \
              | sort -V | tail -1
          }

          MODEL_LATEST=$(latest_version 'org\.jkiss\.dbeaver\.model_')
          UI_LATEST=$(latest_version 'org\.jkiss\.dbeaver\.ui_')
          UTILS_LATEST=$(latest_version 'org\.jkiss\.utils_')

          echo "Latest published: model=$MODEL_LATEST ui=$UI_LATEST utils=$UTILS_LATEST"

          # An empty version means the listing format changed; never write that into pom.xml.
          if [ -z "$MODEL_LATEST" ] || [ -z "$UI_LATEST" ] || [ -z "$UTILS_LATEST" ]; then
            echo "::error::Could not parse the latest versions from $BASE_URL/ -- listing format changed?"
            exit 1
          fi

          pin_status() {
            # $1: jar name prefix, $2: pinned version
            local url="$BASE_URL/${1}${2}.jar"
            if curl -sf -o /dev/null "$url"; then
              echo "reachable"
            else
              echo "404"
            fi
          }

          MODEL_STATUS=$(pin_status 'org.jkiss.dbeaver.model_' "$MODEL_PINNED")
          UI_STATUS=$(pin_status 'org.jkiss.dbeaver.ui_' "$UI_PINNED")
          UTILS_STATUS=$(pin_status 'org.jkiss.utils_' "$UTILS_PINNED")

          echo "Pin reachability: model=$MODEL_STATUS ui=$UI_STATUS utils=$UTILS_STATUS"

          DRIFT=false
          if [ "$MODEL_PINNED" != "$MODEL_LATEST" ] || [ "$MODEL_STATUS" = "404" ]; then DRIFT=true; fi
          if [ "$UI_PINNED" != "$UI_LATEST" ] || [ "$UI_STATUS" = "404" ]; then DRIFT=true; fi
          if [ "$UTILS_PINNED" != "$UTILS_LATEST" ] || [ "$UTILS_STATUS" = "404" ]; then DRIFT=true; fi

          {
            echo "drift=$DRIFT"
            echo "model_latest=$MODEL_LATEST"
            echo "ui_latest=$UI_LATEST"
            echo "utils_latest=$UTILS_LATEST"
          } >> "$GITHUB_OUTPUT"

          {
            echo "table<<EOF"
            echo "| Dependency | Pinned | Latest published | Pinned URL |"
            echo "|---|---|---|---|"
            echo "| \`org.jkiss.dbeaver.model\` | \`$MODEL_PINNED\` | \`$MODEL_LATEST\` | $MODEL_STATUS |"
            echo "| \`org.jkiss.dbeaver.ui\` | \`$UI_PINNED\` | \`$UI_LATEST\` | $UI_STATUS |"
            echo "| \`org.jkiss.utils\` | \`$UTILS_PINNED\` | \`$UTILS_LATEST\` | $UTILS_STATUS |"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump pins in pom.xml
        id: bump
        if: steps.check.outputs.drift == 'true'
        env:
          MODEL_LATEST: ${{ steps.check.outputs.model_latest }}
          UI_LATEST: ${{ steps.check.outputs.ui_latest }}
          UTILS_LATEST: ${{ steps.check.outputs.utils_latest }}
        run: |
          set -euo pipefail
          sed -i -E \
            -e "s#(<dbeaver\.model\.version>)[^<]+#\1${MODEL_LATEST}#" \
            -e "s#(<dbeaver\.ui\.version>)[^<]+#\1${UI_LATEST}#" \
            -e "s#(<dbeaver\.jkissutils\.version>)[^<]+#\1${UTILS_LATEST}#" \
            pom.xml
          git diff --stat pom.xml
          if git diff --quiet pom.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error: a failing build against the new DBeaver jars is an expected outcome
      # (API change), handled below by falling back to the tracking issue.
      - name: Build against the bumped pins (clean verify)
        id: build
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Open or update pull request
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TABLE: ${{ steps.check.outputs.table }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BOT_BRANCH"
          git add pom.xml
          git commit -m "Bump DBeaver p2 pins to the latest published build"
          git push --force origin "$BOT_BRANCH"

          BODY=$(cat <<EOF
          The DBeaver p2 dependency pins in \`pom.xml\` have drifted from what's currently
          published at \`dbeaver.io/update/latest/plugins/\`, or one of the pinned jars is no
          longer reachable there. This PR moves them to the latest published build;
          \`./mvnw clean verify\` passed against it in the workflow run.

          $TABLE

          (Opened automatically by \`.github/workflows/check-dbeaver-deps.yml\`.)
          EOF
          )

          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "$BOT_BRANCH" \
            --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh pr create --repo "${{ github.repository }}" \
              --base "$BASE_BRANCH" --head "$BOT_BRANCH" \
              --title "Bump DBeaver p2 pins to the latest published build" \
              --body "$BODY"
          fi

      - name: Open or update tracking issue
        if: steps.check.outputs.drift == 'true' && steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TABLE: ${{ steps.check.outputs.table }}
          MODEL_LATEST: ${{ steps.check.outputs.model_latest }}
          UI_LATEST: ${{ steps.check.outputs.ui_latest }}
          UTILS_LATEST: ${{ steps.check.outputs.utils_latest }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$BUILD_OUTCOME" = "failure" ]; then
            NOTE="The automatic bump to the versions below was built but \`./mvnw clean verify\` failed ([run]($RUN_URL)); a DBeaver API change most likely needs a manual fix."
          else
            NOTE="The automatic bump did not run or changed nothing ([run]($RUN_URL))."
          fi

          BODY=$(cat <<EOF
          The DBeaver p2 dependency pins in \`pom.xml\` have drifted from what's
          currently published at \`dbeaver.io/update/latest/plugins/\`, or one of the pinned jars is no
          longer reachable there.

          $NOTE

          $TABLE

          Update the pinned properties in \`pom.xml\`:
          \`\`\`xml
          <dbeaver.model.version>$MODEL_LATEST</dbeaver.model.version>
          <dbeaver.ui.version>$UI_LATEST</dbeaver.ui.version>
          <dbeaver.jkissutils.version>$UTILS_LATEST</dbeaver.jkissutils.version>
          \`\`\`

          (Opened automatically by \`.github/workflows/check-dbeaver-deps.yml\`.)
          EOF
          )

          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --search 'in:title "DBeaver p2 pins" is:open' \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "DBeaver p2 pins are stale" \
              --body "$BODY"
          fi

      - name: Close tracking issue and bot PR if pins are back in sync
        if: steps.check.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --search 'in:title "DBeaver p2 pins" is:open' \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "${{ github.repository }}" \
              --comment "Pins now match the latest published DBeaver p2 build. Closing automatically."
          fi

          # A merged bot PR is already closed; this only catches one left open after the pins
          # were fixed some other way.
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "$BOT_BRANCH" \
            --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            gh pr close "$EXISTING_PR" --repo "${{ github.repository }}" --delete-branch \
              --comment "Pins already match the latest published DBeaver p2 build. Closing automatically."
          fi
